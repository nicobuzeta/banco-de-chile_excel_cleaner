[project]
name = "bank-importer"
version = "0.2.0"
description = "Extensible bank statement importer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "xlrd>=2.0",
]

[project.scripts]
bank-importer = "bank_importer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_importer"]
